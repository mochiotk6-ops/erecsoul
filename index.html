<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ELECTRIC SOUL β2.20</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02070a;font-family:Arial,"Noto Sans JP",sans-serif;color:#dffcff;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#hud{position:absolute;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid rgba(94,238,255,.35);background:linear-gradient(180deg,rgba(1,7,10,.94),rgba(1,7,10,.55));pointer-events:none;z-index:5}
#title{font-weight:800;letter-spacing:2px;font-size:17px;text-shadow:0 0 10px #4deaff}
#stageTitle{font-size:15px;letter-spacing:3px;color:#8eefff}
#status{font-size:11px;letter-spacing:2px;color:#6e9da6}
#batteryHud{position:absolute;top:9px;right:18px;width:132px;z-index:7;pointer-events:none;text-align:right}
.batteryBox{height:31px;display:flex;align-items:center;justify-content:flex-end;filter:drop-shadow(0 0 8px rgba(74,233,255,.16))}
.batteryBody{width:105px;height:28px;border:2px solid rgba(205,255,255,.82);border-radius:4px;padding:3px;display:flex;gap:3px;background:rgba(3,14,18,.8);box-shadow:inset 0 0 10px rgba(69,229,247,.08)}
.batteryTip{width:6px;height:12px;border:2px solid rgba(205,255,255,.82);border-left:0;border-radius:0 3px 3px 0}
.batteryCell{display:block;flex:1;border-radius:1px;background:#35e23c;box-shadow:0 0 8px rgba(53,226,60,.42)}
.batteryCell.empty{background:rgba(47,72,76,.38);box-shadow:none}
.chargeLabel{font-size:7px;letter-spacing:2px;color:#73a7af;margin-top:2px;margin-bottom:3px}
.chargeTrack{height:5px;border:1px solid rgba(106,231,247,.45);background:rgba(5,19,23,.9);border-radius:3px;overflow:hidden}
#chargeFill{height:100%;width:0%;background:#61eaff;box-shadow:0 0 8px rgba(97,234,255,.65);transition:width .05s linear}
#message{position:absolute;top:76px;left:50%;transform:translateX(-50%);padding:7px 14px;border:1px solid rgba(104,231,247,.5);background:rgba(3,14,19,.82);font-size:11px;letter-spacing:1px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:6}
#controls{position:absolute;left:0;right:0;bottom:0;height:170px;z-index:10;pointer-events:none}
#verticalPad{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:128px;height:136px;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.dir{width:118px;height:60px;border:2px solid rgba(105,233,255,.78);border-radius:18px;background:rgba(4,18,24,.9);color:#c8fbff;font-size:34px;line-height:54px;text-align:center;box-shadow:0 0 20px rgba(55,225,255,.12),inset 0 0 18px rgba(55,225,255,.07);user-select:none;touch-action:none;-webkit-user-select:none}
.dir.on{background:rgba(35,128,148,.62);box-shadow:0 0 28px rgba(75,232,255,.5),inset 0 0 20px rgba(75,232,255,.18);transform:scale(.96)}
#hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:11px;line-height:1.5;color:#7fa8b0;letter-spacing:1px;text-shadow:0 0 8px rgba(70,220,240,.2);pointer-events:none;white-space:nowrap}
#start,#clear{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle at 50% 45%,rgba(12,54,65,.45),rgba(1,6,9,.98) 68%);z-index:20}
.logo{font-size:32px;font-weight:900;letter-spacing:5px;text-shadow:0 0 14px #55edff,0 0 34px rgba(65,220,255,.4)}
.sub{margin-top:8px;font-size:12px;color:#76a5ad;letter-spacing:3px}
.startBtn{margin-top:30px;min-width:190px;padding:15px 24px;border:1px solid #63eaff;border-radius:8px;background:#06151b;color:#dfffff;font-weight:800;letter-spacing:3px;font-size:14px;box-shadow:0 0 20px rgba(70,230,255,.14);touch-action:manipulation}
.startBtn:active{transform:scale(.97);background:#0b2730}
#clear{display:none}
#gameOver{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(2,5,8,.82);backdrop-filter:blur(2px);z-index:30}
.gameOverTitle{font-size:28px;font-weight:900;letter-spacing:5px;color:#ff6b75;text-shadow:0 0 16px rgba(255,72,84,.7)}
.gameOverSub{margin-top:10px;font-size:11px;color:#a9c0c4;letter-spacing:2px}
#gameOver .startBtn{margin-top:24px}
.clearTitle{font-size:24px;letter-spacing:4px;text-shadow:0 0 12px #5eeaff}
.clearSub{margin-top:12px;color:#82aab1;font-size:12px;letter-spacing:2px}
@media(min-width:700px){#verticalPad{right:32px;bottom:112px}.hint{right:32px;left:auto;transform:none}.logo{font-size:40px}}
/* β2.15 UI layout: reference image's composition, rendered in ELECTRIC SOUL's neon industrial style. */
#batteryHud{position:absolute;left:8px;right:auto;top:auto;bottom:18px;width:180px;height:auto;display:flex;flex-direction:column;align-items:flex-start;gap:7px;z-index:12;pointer-events:none}
#batteryHud .batteryBox{width:174px;flex:0 0 47px;height:47px;align-self:flex-start;justify-content:flex-start}
#batteryHud .batteryBody{width:158px;height:42px;border-width:2px;padding:4px;gap:4px}
#batteryHud .batteryTip{width:9px;height:18px;border-width:2px}
#batteryHud .chargeLabel{font-size:9px;letter-spacing:2px;color:#73a7af;margin:0 0 -2px 2px;text-shadow:0 0 8px rgba(70,220,240,.25)}
#batteryHud .chargeTrack{width:180px;max-width:none;height:10px;border:1px solid rgba(106,231,247,.58);border-radius:4px;align-self:flex-start;margin:0;box-shadow:0 0 12px rgba(70,230,255,.08),inset 0 0 8px rgba(70,230,255,.08)}
#verticalPad{left:auto;right:20px;bottom:18px;transform:none;width:128px;height:136px}
#hint{left:auto;right:20px;transform:none;bottom:2px}
.gameOverDistance{margin-top:14px;font-size:30px;font-weight:900;letter-spacing:2px;color:#dfffff;text-shadow:0 0 12px rgba(70,230,255,.55)}
#infectionHud{position:absolute;left:8px;bottom:105px;top:auto;transform:none;width:180px;min-width:180px;display:none;color:#ff7884;font-size:18px;font-weight:900;letter-spacing:3px;text-align:left;line-height:1.2;text-shadow:0 0 8px #ff334d,0 0 22px rgba(255,40,60,.55);z-index:13;pointer-events:none;opacity:1}
.infectionFlash{animation:infectionFlash 1.8s ease-in-out infinite}
@keyframes infectionFlash{0%,100%{opacity:.18;filter:blur(.3px)}50%{opacity:1;filter:blur(0)}}
.batteryCell.infected{background:#cfa8e8!important;box-shadow:0 0 10px rgba(207,168,232,.72)!important}
#infectionHud{display:none;min-width:180px;text-align:left;line-height:1.2}
#infectionGauge{display:none;width:180px;height:5px;margin:8px 0 0;border:1px solid rgba(255,120,132,.55);background:rgba(35,8,12,.85);border-radius:3px;overflow:hidden;box-shadow:inset 0 0 5px rgba(255,50,70,.15)}
#infectionGaugeFill{height:100%;width:100%;background:#ff7884;box-shadow:0 0 7px rgba(255,70,90,.6);transition:width .05s linear}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div id="title">ELECTRIC SOUL // β2.20</div><div id="stageTitle">TEST STAGE</div><div id="status">CURRENT // AUTO RUN // NO GOAL</div></div>
<div id="batteryHud"><div class="batteryBox"><div class="batteryBody"><span class="batteryCell" id="bat0"></span><span class="batteryCell" id="bat1"></span><span class="batteryCell" id="bat2"></span></div><div class="batteryTip"></div></div><div class="chargeLabel">CHARGE</div><div class="chargeTrack"><div id="chargeFill"></div></div></div>
<div id="infectionHud"><span id="infectionLabel">⚠ 充電不可</span><div id="infectionGauge"><div id="infectionGaugeFill"></div></div></div><div id="message"></div>
<div id="controls">
  <div id="verticalPad">
    <div class="dir" id="up">▲</div>
    <div class="dir" id="down">▼</div>
  </div>
  <div id="hint">▲ ▼　電線を切り替える</div>
</div>
<div id="start"><div class="logo">ELECTRIC SOUL</div><div class="sub">β2.20 // ELECTRIC RUNNER</div><button class="startBtn" id="startBtn">START</button></div>
<div id="clear"><div class="clearTitle">STAGE CLEAR</div><div class="clearSub">ELECTRIC SOUL // β2.20</div><button class="startBtn" id="restartBtn">もう一度走る</button></div>
<div id="gameOver"><div class="gameOverTitle">GAME OVER</div><div class="gameOverSub">BATTERY EMPTY // RETRY FROM START</div><div id="gameOverDistance" class="gameOverDistance">0 m</div><button class="startBtn" id="gameOverBtn">最初からリトライ</button></div>
<script>
'use strict';
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

const state={running:false,clear:false,t:0,cam:0,last:0,wire:1,wireVisual:1,wirePulse:0,speed:1000,worldW:100000,particles:[],sparks:[],battery:3,charge:0,damageTimer:0,shake:0,viruses:[],energies:[],infectionTimer:0,infectionMax:0,infectionFade:0,infectionType:''};
const keys={up:false,down:false};
const wires=[
  {y:260,label:'UPPER',glow:'#56eaff'},
  {y:360,label:'CORE',glow:'#7cf2ff'},
  {y:460,label:'LOWER',glow:'#48d9f3'},
  {y:560,label:'HIGH SPEED',glow:'#ff4055',speedMul:2}
];
const player={x:160,y:360,targetY:360,r:13,phase:0};

function showMessage(text){const e=document.getElementById('message');e.textContent=text;e.style.opacity=1;clearTimeout(showMessage.timer);showMessage.timer=setTimeout(()=>e.style.opacity=0,1100)}
function generateViruses(){
  state.viruses.length=0;
  state.energies.length=0;
  // CORE / LOWER / HIGH SPEED にランダム配置。隣接電線のウイルスは最低2目盛(220px)離す。
  const lanes=[1,2,3];
  const placed={0:[],1:[],2:[],3:[]};
  for(const lane of lanes){
    let x=900+Math.random()*500;
    const count=Math.ceil((state.worldW-1200)/900);
    for(let i=0;i<count;i++){
      let candidate=x+650+Math.random()*900;
      let tries=0;
      while(tries<50){
        const adjacent=[];
        if(lane>0)adjacent.push(...placed[lane-1]);
        if(lane<3)adjacent.push(...placed[lane+1]);
        if(adjacent.every(v=>Math.abs(v-candidate)>=220))break;
        candidate+=220+Math.random()*400;
        tries++;
      }
      x=candidate;
      const red=Math.random()<0.5; const v={x,y:wires[lane].y,lane,r:11.4,phase:Math.random()*Math.PI*2,red};
      state.viruses.push(v);
      placed[lane].push(candidate);
    }
  }
  state.viruses.sort((a,b)=>a.x-b.x);

  // 目盛(110px)ごとに5%の確率でエナジーを抽選。全4本が対象。
  for(let lane=0;lane<wires.length;lane++){
    for(let x=1100;x<state.worldW-1200;x+=110){
      if(Math.random()>=0.05)continue;
      const ex=x;
      const blocked=state.viruses.some(v=>v.lane===lane && Math.abs(v.x-ex)<120);
      if(!blocked)state.energies.push({x:ex,y:wires[lane].y,lane,r:6.84,phase:Math.random()*Math.PI*2});
    }
  }
  state.energies.sort((a,b)=>a.x-b.x);
}
function updateBatteryHud(){
  for(let i=0;i<3;i++){
    const cell=document.getElementById('bat'+i);
    cell.classList.toggle('empty',i>=state.battery);
    cell.classList.toggle('infected',state.infectionTimer>0 && i<state.battery);
  }
  const active=state.battery<3;
  document.getElementById('chargeFill').style.width=(active?Math.min(100,state.charge/10*100):0)+'%';
}
// β2.20: 充電不可7秒、視界不良/操作不良5秒
function startInfection(type){
  state.infectionType=type;
  state.infectionTimer=(type==='charging'?7:5);
  state.infectionMax=state.infectionTimer;
  state.infectionFade=0;
  const names={
    charging:'⚠ 充電不可',
    vision:'⚠ 視界不良',
    control:'⚠ 操作不良'
  };
  const inf=document.getElementById('infectionHud');
  // infectionHud にはゲージの子要素があるため、親の textContent は変更しない。
  // textContent を設定すると全ての子要素が削除され、infectionGauge が消えてしまう。
  document.getElementById('infectionLabel').textContent=names[type];
  inf.style.display='block';
  document.getElementById('infectionGauge').style.display='block';
  document.getElementById('infectionGaugeFill').style.width='100%';
  inf.classList.remove('infectionFlash');
  void inf.offsetWidth;
  inf.classList.add('infectionFlash');
  showMessage(names[type]+' // '+state.infectionTimer+'s');
}
function endInfection(){
  state.infectionTimer=0;
  updateBatteryHud();
  state.infectionFade=1;
  state.infectionType='';
  state.infectionMax=0;
  const inf=document.getElementById('infectionHud');
  inf.classList.remove('infectionFlash');
  inf.style.opacity='0';
  setTimeout(()=>{
    if(state.infectionTimer<=0){
      inf.style.display='none';
      inf.style.opacity='1';
      document.getElementById('infectionGauge').style.display='none';
      document.getElementById('infectionGaugeFill').style.width='0%';
    }
  },700);
}
function damage(red=false){
  if(state.damageTimer>0||!state.running)return;
  state.battery=Math.max(0,state.battery-1);
  state.charge=0;
  state.damageTimer=1;
  state.shake=.65;
  if(red){
    // 感染中は追加ダメージは受けるが、感染効果は重複・上書きしない。
    if(state.infectionTimer<=0){
      const roll=Math.random(); // β2.20: 34% / 33% / 33%
      if(roll<0.34)startInfection('charging');
      else if(roll<0.67)startInfection('vision');
      else startInfection('control');
    }else{
      showMessage('RED VIRUS // BATTERY -1');
    }
  }else{
    showMessage('VIRUS CONTACT // BATTERY -1');
  }
  updateBatteryHud();
  if(state.battery<=0){
    state.infectionTimer=0;state.infectionMax=0;state.infectionType='';state.infectionFade=0;
    const inf=document.getElementById('infectionHud');inf.style.display='none';inf.style.opacity='1';inf.classList.remove('infectionFlash');
    document.getElementById('infectionGauge').style.display='none';document.getElementById('infectionGaugeFill').style.width='0%';
    document.getElementById('infectionLabel').textContent='⚠ 充電不可';
    state.running=false;
    document.getElementById('gameOverDistance').textContent=distanceMeters()+' m';
    document.getElementById('gameOver').style.display='flex';
  }
}
function checkVirusCollision(){
  if(state.damageTimer>0)return;
  for(const v of state.viruses){
    if(Math.abs(v.x-player.x)<v.r+player.r+3 && Math.abs(v.y-player.y)<v.r+player.r+5){damage(!!v.red);return;}
  }
}
function checkEnergyCollection(){
  for(let i=state.energies.length-1;i>=0;i--){
    const e=state.energies[i];
    if(Math.abs(e.x-player.x)<e.r+player.r+7 && Math.abs(e.y-player.y)<e.r+player.r+7){
      state.energies.splice(i,1);
      if(state.battery<3 && !(state.infectionTimer>0 && state.infectionType==='charging')){
        state.charge=Math.min(10,state.charge+3.3);
        updateBatteryHud();
        showMessage('ENERGY +33% // CHARGE');
        if(state.charge>=10){
          state.battery=Math.min(3,state.battery+1);
          state.charge=0;
          updateBatteryHud();
          showMessage('ENERGY // BATTERY +1');
        }
      }
    }
  }
}
function reset(){state.running=true;state.clear=false;state.t=0;state.cam=0;state.wire=1;state.wireVisual=1;state.wirePulse=0;state.battery=3;state.charge=0;state.damageTimer=0;state.shake=0;state.infectionTimer=0;state.infectionMax=0;state.infectionFade=0;state.infectionType='';player.x=160;player.y=wires[1].y;player.targetY=wires[1].y;player.phase=0;state.particles.length=0;state.sparks.length=0;generateViruses();updateBatteryHud();document.getElementById('start').style.display='none';document.getElementById('clear').style.display='none';document.getElementById('gameOver').style.display='none';document.getElementById('infectionHud').style.display='none';document.getElementById('infectionHud').style.opacity='1';document.getElementById('infectionHud').classList.remove('infectionFlash');document.getElementById('infectionGauge').style.display='none';document.getElementById('infectionGaugeFill').style.width='0%';document.getElementById('infectionLabel').textContent='⚠ 充電不可';document.getElementById('gameOverDistance').textContent='0 m';showMessage('4本の電線 // RUN START')}
function switchWire(dir){
  const next=Math.max(0,Math.min(wires.length-1,state.wire+dir));
  if(next===state.wire)return;
  state.wire=next;
  // 電線の切り替えは即時に確定し、トール自身は短い移動アニメーションで新しい電線へ移る。
  player.targetY=wires[next].y;
  state.wireVisual=next;
  state.wirePulse=1;
  showMessage(next===0?'UPPER LINE':next===1?'CORE LINE':next===2?'LOWER LINE':'HIGH SPEED LINE');
}
function bindButton(id,key,fn){const e=document.getElementById(id);let pid=null;const down=ev=>{ev.preventDefault();pid=ev.pointerId;try{e.setPointerCapture(pid)}catch(_){}keys[key]=true;e.classList.add('on');if(fn)fn()};const up=ev=>{if(pid!==null&&ev.pointerId!==pid)return;ev.preventDefault();keys[key]=false;e.classList.remove('on');pid=null};e.addEventListener('pointerdown',down,{passive:false});e.addEventListener('pointerup',up,{passive:false});e.addEventListener('pointercancel',up,{passive:false});}
bindButton('up','up',()=>switchWire(state.infectionType==='control'?1:-1));
bindButton('down','down',()=>switchWire(state.infectionType==='control'?-1:1));
addEventListener('keydown',e=>{
  if(e.code==='ArrowUp'){
    if(!keys.up){keys.up=true;switchWire(state.infectionType==='control'?1:-1)}
  }
  if(e.code==='ArrowDown'){
    if(!keys.down){keys.down=true;switchWire(state.infectionType==='control'?-1:1)}
  }
});
addEventListener('keyup',e=>{if(e.code==='ArrowUp')keys.up=false;if(e.code==='ArrowDown')keys.down=false});
document.getElementById('startBtn').addEventListener('click',reset);
document.getElementById('restartBtn').addEventListener('click',reset);
document.getElementById('gameOverBtn').addEventListener('click',reset);

function worldX(x){return x-state.cam}
function distanceMeters(){return Math.max(0,Math.floor((player.x-160)/110));}
function speedProgress(){
  const d=distanceMeters();
  if(d<=30)return 0.70;
  if(d>=100)return 1.00;
  return 0.70+(d-30)/70*0.30;
}
function wireY(i){return wires[i].y}
function rect(x,y,w,h,fill,stroke){ctx.fillStyle=fill;ctx.fillRect(worldX(x),y,w,h);if(stroke){ctx.strokeStyle=stroke;ctx.strokeRect(worldX(x)+.5,y+.5,w-1,h-1)}}
function line(x1,y1,x2,y2,style,width){ctx.beginPath();ctx.moveTo(worldX(x1),y1);ctx.lineTo(worldX(x2),y2);ctx.strokeStyle=style;ctx.lineWidth=width;ctx.stroke()}
function addParticles(){
  if(Math.random()<.75){const y=wireY(state.wire);state.particles.push({x:player.x-10-Math.random()*30,y:y+(Math.random()-.5)*8,vx:-2-Math.random()*4,life:20+Math.random()*18,max:38})}
  if(state.particles.length>120)state.particles.splice(0,state.particles.length-120);
}
function update(dt){
  state.t+=dt;
  if(state.damageTimer>0)state.damageTimer=Math.max(0,state.damageTimer-dt);
  if(state.infectionTimer>0){
    state.infectionTimer=Math.max(0,state.infectionTimer-dt);
    const ig=document.getElementById('infectionGaugeFill');
    ig.style.width=(state.infectionMax>0?Math.max(0,state.infectionTimer/state.infectionMax*100):0)+'%';
    if(state.infectionTimer===0)endInfection();
  }
  if(state.infectionFade>0)state.infectionFade=Math.max(0,state.infectionFade-dt/0.7);
  state.shake=Math.max(0,state.shake-dt);
  const moveSpeed=state.speed*speedProgress()*(state.wire===3?2:1); player.x+=moveSpeed*dt;
  player.phase+=dt*0.12;
  // 上下の電線切り替えを滑らかにアニメーション。約0.14秒で到達する。
  const dy=player.targetY-player.y;
  const step=Math.max(1,Math.abs(dy)*Math.min(1,dt/0.07));
  if(Math.abs(dy)<=step) player.y=player.targetY;
  else player.y += Math.sign(dy)*step;
  state.wireVisual=state.wire;
  state.wirePulse=Math.max(0,state.wirePulse-dt*3.5);
  state.cam=Math.max(0,player.x-W*.20);
  state.cam=Math.min(state.cam,Math.max(0,state.worldW-W*.78));
  if(state.battery<3 && !(state.infectionTimer>0 && state.infectionType==='charging')){
    state.charge+=dt;
    if(state.charge>=10){state.battery=Math.min(3,state.battery+1);state.charge=0;updateBatteryHud();showMessage('BATTERY +1 // CHARGED');}
  }else{state.charge=0;}
  updateBatteryHud();
  checkVirusCollision();
  checkEnergyCollection();
  addParticles();
  for(let i=state.particles.length-1;i>=0;i--){const p=state.particles[i];p.x+=p.vx*dt*4;p.y+=p.vy*dt*4;p.life-=dt*60;if(p.life<=0)state.particles.splice(i,1)}
}

function drawBackground(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#02070c');g.addColorStop(.5,'#06121a');g.addColorStop(1,'#020609');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const grid=80;const off=-(state.cam*.18)%grid;
  ctx.strokeStyle='rgba(66,151,169,.09)';ctx.lineWidth=1;
  for(let x=off;x<W+grid;x+=grid){ctx.beginPath();ctx.moveTo(x,64);ctx.lineTo(x,H-150);ctx.stroke()}
  for(let y=100;y<H-150;y+=55){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  for(let i=0;i<12;i++){
    const x=((i*510-state.cam*.32)%(W+700))-100;
    const h=90+(i%5)*36;ctx.fillStyle='rgba(18,42,51,.42)';ctx.fillRect(x, H-150-h, 130, h);
    ctx.fillStyle='rgba(69,153,166,.08)';ctx.fillRect(x+16,H-140-h,3,h-20);ctx.fillRect(x+42,H-140-h,3,h-40);ctx.fillRect(x+78,H-140-h,3,h-10);
  }
  ctx.fillStyle='rgba(83,220,240,.08)';ctx.font='bold 52px Arial';ctx.fillText('SECTOR 02',worldX(1600),170);ctx.font='bold 18px Arial';ctx.fillText('CONDUIT NETWORK // 04',worldX(1670),195);
}
function drawWire(y,glow,label,i){
  const x1=0,x2=state.worldW;
  ctx.shadowBlur=24;ctx.shadowColor=glow;line(x1,y,x2,y,'rgba(37,86,100,.8)',13);line(x1,y,x2,y,glow,5);ctx.shadowBlur=0;line(x1,y,x2,y,'#d9ffff',1);
  for(let x=Math.floor(state.cam/110)*110;x<state.cam+W*2+110;x+=110){
    const sx=worldX(x);ctx.fillStyle='rgba(165,249,255,.85)';ctx.fillRect(sx-2,y-8,4,16);ctx.fillStyle='rgba(84,224,242,.25)';ctx.fillRect(sx-7,y-2,14,4);
  }
  ctx.fillStyle='rgba(113,221,234,.28)';ctx.font='10px Arial';ctx.fillText(label,worldX(40),y-16);
}
function drawPlayer(){
  const y=player.y;const x=worldX(player.x);
  if(state.damageTimer>0 && Math.floor(state.damageTimer*12)%2===0)return;
  ctx.save();ctx.translate(x,y);ctx.rotate(-.08);
  const infected=state.infectionTimer>0;
  const fade=state.infectionFade;
  ctx.shadowBlur=22;
  ctx.shadowColor=infected?'#c88cff':'#7df3ff';
  ctx.fillStyle=infected?'#cfa8e8':'#dfffff';
  if(fade>0){
    const t=fade;
    ctx.fillStyle=`rgb(${Math.round(223+(207-223)*t)},${Math.round(255+(168-255)*t)},${Math.round(255+(232-255)*t)})`;
    ctx.shadowColor='#7df3ff';
  }
  ctx.beginPath();ctx.moveTo(-17,0);ctx.lineTo(-3,-10);ctx.lineTo(11,-7);ctx.lineTo(16,0);ctx.lineTo(8,8);ctx.lineTo(-5,9);ctx.closePath();ctx.fill();
  ctx.fillStyle='#5ee5ff';ctx.fillRect(-3,-4,10,4);ctx.fillStyle='#ffffff';ctx.fillRect(6,-2,5,3);
  ctx.fillStyle='rgba(104,235,255,.7)';ctx.beginPath();ctx.moveTo(-17,0);ctx.lineTo(-27,-5);ctx.lineTo(-20,3);ctx.closePath();ctx.fill();
  // 顔：通常は縦線の目、ダメージ中は「> <」の痛がる表情
  ctx.shadowBlur=5;ctx.shadowColor='#2aa8ff';ctx.strokeStyle='#2aa8ff';ctx.lineWidth=2.2;ctx.lineCap='round';ctx.beginPath();
  if(state.damageTimer>0){
    ctx.moveTo(1,-4);ctx.lineTo(5,0);ctx.lineTo(1,4);
    ctx.moveTo(11,-4);ctx.lineTo(7,0);ctx.lineTo(11,4);
  }else{
    ctx.moveTo(3,-4);ctx.lineTo(3,3);
    ctx.moveTo(10,-4);ctx.lineTo(10,3);
  }
  ctx.stroke();
  ctx.restore();
  ctx.shadowBlur=0;
  if(Math.random()<.35){ctx.fillStyle='#dfffff';ctx.fillRect(x-10+(Math.random()*20),y-15+(Math.random()*30),2,2)}
}
function drawVirus(v){
  const x=worldX(v.x),y=v.y;
  if(x<-50||x>W*2+50)return;
  ctx.save();ctx.translate(x,y);ctx.rotate(v.phase+state.t*.18);ctx.scale(.6,.6);
  ctx.shadowBlur=18;ctx.shadowColor=v.red?'rgba(255,55,70,.9)':'rgba(180,70,255,.8)';
  // トゲトゲしたウイルス外殻
  ctx.fillStyle=v.red?'#d51f3a':'#7b2cbf';ctx.strokeStyle=v.red?'#ff8a96':'#c77dff';ctx.lineWidth=2;
  ctx.beginPath();
  for(let i=0;i<16;i++){const a=i*Math.PI/8;const rr=i%2?20:29;const px=Math.cos(a)*rr,py=Math.sin(a)*rr;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.shadowBlur=0;ctx.fillStyle=v.red?'#751326':'#4a176f';ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.fill();
  // ウイルスの突起
  for(let i=0;i<8;i++){const a=i*Math.PI/4;const bx=Math.cos(a)*21,by=Math.sin(a)*21;ctx.strokeStyle=v.red?'#ff9ca5':'#d896ff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(Math.cos(a)*30,Math.sin(a)*30);ctx.stroke();ctx.fillStyle=v.red?'#ffc0c6':'#e5b3ff';ctx.beginPath();ctx.arc(Math.cos(a)*31,Math.sin(a)*31,3,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle=v.red?'#ffe0e3':'#f0d0ff';ctx.beginPath();ctx.arc(-5,-4,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(7,5,3,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawViruses(){for(const v of state.viruses)drawVirus(v);}
function drawEnergy(e){
  const x=worldX(e.x),y=e.y;
  if(x<-40||x>W*2+40)return;
  const s=1+Math.sin(state.t*7+e.phase)*.08;
  ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);ctx.scale(s,s);
  ctx.shadowBlur=18;ctx.shadowColor='#c8f8ff';
  ctx.fillStyle='#d8fbff';ctx.fillRect(-6.84,-6.84,13.68,13.68);
  ctx.fillStyle='#7eeeff';ctx.fillRect(-4.3,-4.3,8.6,8.6);
  ctx.strokeStyle='rgba(240,255,255,.95)';ctx.lineWidth=1.5;ctx.strokeRect(-6.84,-6.84,13.68,13.68);
  ctx.restore();ctx.shadowBlur=0;
}
function drawEnergies(){for(const e of state.energies)drawEnergy(e);}
function drawParticles(){for(const p of state.particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle='#bffcff';ctx.fillRect(worldX(p.x),p.y,2,2)}ctx.globalAlpha=1}
function drawStations(){
  for(let i=0;i<wires.length;i++){
    const y=wireY(i);const sx=worldX(0);ctx.fillStyle='#09151b';ctx.fillRect(sx,y-32,46,64);ctx.strokeStyle='#4ed9eb';ctx.strokeRect(sx+.5,y-31.5,45,63);ctx.fillStyle='#5ceaff';ctx.fillRect(sx+10,y-5,26,10);
    const ex=worldX(state.worldW-42);ctx.fillStyle='#09151b';ctx.fillRect(ex,y-32,46,64);ctx.strokeStyle='#4ed9eb';ctx.strokeRect(ex+.5,y-31.5,45,63);ctx.fillStyle='#7df3ff';ctx.fillRect(ex+8,y-17,30,5);ctx.fillRect(ex+8,y-4,30,5);ctx.fillRect(ex+8,y+9,30,5);
  }
}
function drawSwitchEffect(){if(state.wirePulse<=0)return;const y=wireY(state.wireVisual),x=worldX(player.x);ctx.globalAlpha=state.wirePulse;ctx.strokeStyle='#eaffff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,25+(1-state.wirePulse)*30,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}
function drawGoal(){const x=worldX(state.worldW-220);for(let i=0;i<5;i++){ctx.fillStyle='rgba(85,232,255,'+(0.15+i*.08)+')';ctx.fillRect(x+i*12,150-i*8,3,H-300+i*16)}ctx.fillStyle='#cfffff';ctx.font='bold 13px Arial';ctx.fillText('EXIT',x+18,128);ctx.font='10px Arial';ctx.fillStyle='#74b6c0';ctx.fillText('RUN TO THE END',x+18,145)}
function render(){
  ctx.save();
  if(state.shake>0){const amp=8*(state.shake/.65);ctx.translate((Math.random()-.5)*amp,(Math.random()-.5)*amp);}
  // 100%引き：ゲーム世界を50%表示。カメラ右端までのマップ構造物を描画する。
  drawBackground();
  ctx.save();
  ctx.translate(W*.12,H*.25);ctx.scale(.5,.5);
  drawStations();
  wires.forEach((w,i)=>drawWire(w.y,w.glow,w.label,i));
  drawViruses();drawEnergies();drawParticles();drawPlayer();drawSwitchEffect();
  ctx.restore();
  if(state.infectionType==='vision' && state.infectionTimer>0){
    // 視界不良：トールから半径3目盛だけ通常表示。
    // 1目盛=110pxワールド、描画倍率50%なので、3目盛=165px画面距離。
    // 重要：destination-outで既に描いたゲーム画面を消すのではなく、
    // 円の「外側だけ」に暗幕を描く。これで円の内側は完全に元の画面を維持する。
    const vx=W*.12+worldX(player.x)*.5;
    const vy=H*.25+player.y*.5;
    const vr=137.5;
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,.96)';
    ctx.beginPath();
    ctx.rect(0,0,W,H);
    ctx.arc(vx,vy,vr,0,Math.PI*2,true);
    // evenoddで「画面全体－円」の領域だけを塗る。
    ctx.fill('evenodd');
    ctx.restore();
  }
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(0,H-150,W,150);
  ctx.strokeStyle='rgba(92,224,241,.13)';ctx.beginPath();ctx.moveTo(0,H-150);ctx.lineTo(W,H-150);ctx.stroke();
  if(state.running){ctx.fillStyle='#dfffff';ctx.font='900 30px Arial';ctx.shadowBlur=12;ctx.shadowColor='rgba(70,230,255,.55)';ctx.fillText(Math.floor(Math.max(0,player.x-160)/110)+' m',W-115,96);ctx.shadowBlur=0}
  ctx.restore();
}
function loop(now){const dt=Math.min(.035,((now-state.last)||16.7)/1000);state.last=now;if(state.running)update(dt);render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
