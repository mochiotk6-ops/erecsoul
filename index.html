<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02070a;font-family:Arial,"Noto Sans JP",sans-serif;color:#dffcff;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#hud{position:absolute;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid rgba(94,238,255,.35);background:linear-gradient(180deg,rgba(1,7,10,.94),rgba(1,7,10,.55));pointer-events:none;z-index:5}

.batteryBox{height:31px;display:flex;align-items:center;justify-content:flex-end;filter:drop-shadow(0 0 8px rgba(74,233,255,.16))}
.batteryBody{width:105px;height:28px;border:2px solid rgba(205,255,255,.82);border-radius:4px;padding:3px;display:flex;gap:3px;background:rgba(3,14,18,.8);box-shadow:inset 0 0 10px rgba(69,229,247,.08)}

.dir{width:118px;height:60px;border:2px solid rgba(105,233,255,.78);border-radius:18px;background:rgba(4,18,24,.9);color:#c8fbff;font-size:34px;line-height:54px;text-align:center;box-shadow:0 0 20px rgba(55,225,255,.12),inset 0 0 18px rgba(55,225,255,.07);user-select:none;touch-action:none;-webkit-user-select:none}
.dir.on{background:rgba(35,128,148,.62);box-shadow:0 0 28px rgba(75,232,255,.5),inset 0 0 20px rgba(75,232,255,.18);transform:scale(.96)}

.logo{font-size:32px;font-weight:900;letter-spacing:5px;text-shadow:0 0 14px #55edff,0 0 34px rgba(65,220,255,.4)}

.startBtn{margin-top:30px;min-width:190px;padding:15px 24px;border:1px solid #63eaff;border-radius:8px;background:#06151b;color:#dfffff;font-weight:800;letter-spacing:3px;font-size:14px;box-shadow:0 0 20px rgba(70,230,255,.14);touch-action:manipulation}

#stageSelect{display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle at 50% 42%,rgba(12,54,65,.48),rgba(1,6,9,.98) 70%);z-index:20}
.stageLogo{font-size:30px;font-weight:900;letter-spacing:5px;text-shadow:0 0 14px #55edff,0 0 34px rgba(65,220,255,.4)}

.gameOverSub{margin-top:10px;font-size:11px;color:#a9c0c4;letter-spacing:2px}
#gameOver .startBtn{margin-top:24px}
.clearTitle{font-size:24px;letter-spacing:4px;text-shadow:0 0 12px #5eeaff}

@media(min-width:700px){#verticalPad{right:32px;bottom:112px}.hint{right:32px;left:auto;transform:none}.logo{font-size:40px}}
/* β2.15 UI layout: reference image's composition, rendered in ELECTRIC SOUL's neon industrial style. */
#batteryHud{position:absolute;left:8px;right:auto;top:auto;bottom:10px;width:180px;height:auto;display:flex;flex-direction:column;align-items:flex-start;gap:7px;z-index:12;pointer-events:none}
#batteryHud .batteryBox{width:174px;flex:0 0 47px;height:47px;align-self:flex-start;justify-content:flex-start}
#batteryHud .batteryBody{width:158px;height:42px;border-width:2px;padding:4px;gap:4px}
#batteryHud .batteryTip{width:9px;height:18px;border-width:2px}
#batteryHud .chargeLabel{font-size:9px;letter-spacing:2px;color:#73a7af;margin:0 0 -2px 2px;text-shadow:0 0 8px rgba(70,220,240,.25)}
#batteryHud .chargeTrack{width:180px;max-width:none;height:10px;border:1px solid rgba(106,231,247,.58);border-radius:4px;align-self:flex-start;margin:0;box-shadow:0 0 12px rgba(70,230,255,.08),inset 0 0 8px rgba(70,230,255,.08)}
#verticalPad{left:auto;right:20px;bottom:8px;transform:none;width:128px;height:136px}
#hint{left:auto;right:20px;transform:none;bottom:2px}
.gameOverDistance{margin-top:14px;font-size:30px;font-weight:900;letter-spacing:2px;color:#dfffff;text-shadow:0 0 12px rgba(70,230,255,.55)}
#infectionHud{position:absolute;left:8px;bottom:95px;top:auto;transform:none;width:180px;min-width:180px;display:none;color:#ff7884;font-size:18px;font-weight:900;letter-spacing:3px;text-align:left;line-height:1.2;text-shadow:0 0 8px #ff334d,0 0 22px rgba(255,40,60,.55);z-index:13;pointer-events:none;opacity:1}
.infectionFlash #infectionLabel{animation:infectionFlash 1.8s ease-in-out infinite}
@keyframes infectionFlash{0%,100%{opacity:.18;filter:blur(.3px)}50%{opacity:1;filter:blur(0)}}
.batteryCell.infected{background:#cfa8e8!important;box-shadow:0 0 10px rgba(207,168,232,.72)!important}
#infectionHud{display:none;min-width:180px;text-align:left;line-height:1.2}
#infectionGauge{display:none;width:180px;height:5px;margin:8px 0 0;border:1px solid rgba(255,120,132,.55);background:rgba(35,8,12,.85);border-radius:3px;overflow:hidden;box-shadow:inset 0 0 5px rgba(255,50,70,.15)}
#infectionGaugeFill{height:100%;width:100%;background:#ff7884;box-shadow:0 0 7px rgba(255,70,90,.6);transition:width .05s linear}
#designatedHud{position:absolute;top:78px;left:50%;transform:translateX(-50%);display:none;z-index:14;pointer-events:none;text-align:center;font-weight:900;letter-spacing:3px;text-shadow:0 0 10px #ff9d32,0 0 24px rgba(255,125,20,.65)}
#designatedWarning{font-size:22px;color:#ffb35c}
#designatedCount{font-size:42px;color:#fff0cf;line-height:1;margin-top:2px}
.designatedBlink{animation:designatedBlink 1s steps(1,end) infinite}
.designatedFastBlink{animation:designatedBlink .5s steps(1,end) infinite}
@keyframes designatedBlink{0%,49%{opacity:1}50%,100%{opacity:.18}}

</style>

<body>
<canvas id="game"></canvas>
<div id="hud"><div id="title">ELECTRIC SOUL // β2.28.4</div><div id="stageTitle">STAGE 0 // MAP 0-1</div><div id="status">CURRENT // AUTO RUN // NO GOAL</div></div>
<div id="batteryHud"><div class="batteryBox"><div class="batteryBody"><span class="batteryCell" id="bat0"></span><span class="batteryCell" id="bat1"></span><span class="batteryCell" id="bat2"></span></div><div class="batteryTip"></div></div><div class="chargeLabel">CHARGE</div><div class="chargeTrack"><div id="chargeFill"></div></div></div>
<div id="infectionHud"><span id="infectionLabel">⚠ 充電不可</span><div id="infectionGauge"><div id="infectionGaugeFill"></div></div></div><div id="designatedHud"><div id="designatedWarning">⚠️大電流</div><div id="designatedCount"></div></div><div id="message"></div><div id="busterBtn">BUSTER</div>
<div id="controls"><div id="energyGaugeHud"><span class="egLabel" id="energyLabel">0/30</span><div id="energyGaugeTrack"><div id="energyGaugeFill"></div></div></div>
  <div id="verticalPad">
    <div class="dir" id="up">▲</div>
    <div class="dir" id="down">▼</div>
  </div>
  <div id="hint">▲ ▼　電線を切り替える</div>
</div>
<div id="stageSelect"><div class="stageLogo">ELECTRIC SOUL</div><div class="stageSelectSub">STAGE SELECT // β2.28.4</div><div class="stageList"><div class="stageBlock"><div class="stageName">STAGE 0</div><div class="mapRow"><button class="mapBtn" id="map01">①<span class="mapLabel">MAP 0-1</span></button><button class="mapBtn locked" disabled>②<span class="mapLabel">LOCKED</span></button><button class="mapBtn locked" disabled>③<span class="mapLabel">LOCKED</span></button></div></div></div></div><div id="start" style="display:none"><div class="logo">ELECTRIC SOUL</div><div class="sub">β2.28.4 // ELECTRIC RUNNER</div><button class="startBtn" id="startBtn">START</button></div>
<div id="clear"><div class="clearTitle">STAGE CLEAR</div><div class="clearSub">ELECTRIC SOUL // β2.28.4</div><button class="startBtn" id="restartBtn">もう一度走る</button></div>
<div id="gameOver"><div class="gameOverTitle">GAME OVER</div><div class="gameOverSub">BATTERY EMPTY // RETRY FROM START</div><div id="gameOverDistance" class="gameOverDistance">0 m</div><button class="startBtn" id="gameOverBtn">最初からリトライ</button></div>
<script>
'use strict';
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

const state={running:false,clear:false,t:0,cam:0,last:0,wire:1,wireVisual:1,wirePulse:0,speed:850,worldW:102000,particles:[],sparks:[],battery:3,charge:0,energyCollected:0,busterCharge:0,busterActive:0,busterMax:5,damageTimer:0,shake:0,viruses:[],energies:[],infectionTimer:0,infectionMax:0,infectionFade:0,infectionType:'',designated:{phase:'idle',targetX:null,nextM:10,lane:-1,timer:0,maxTime:0,elapsed:0,penaltyTimer:0},shockTimer:0,shockMax:0};
const keys={up:false,down:false};
// β2.27.8: 電線は最大7枠の固定スペース内で増減する。
// ここを書き換えるだけで、距離ごとの電線構成を自由に設計できる。
// type は下記 WIRE_TYPES の名前を指定する。
// 例：['UPPER','CORE','LOWER','HIGH SPEED']
// β2.27.8：画面内には常に7本分の固定スペースを確保する。
// 従来の4本は中央4枠（2〜5）に配置し、電線が増減しても
// 電線間隔・カメラ位置を再計算しない。上下の空き枠へ追加／削除する。
const WIRE_SLOT_TOP=60;
const WIRE_SLOT_STEP=100;
const WIRE_SLOT_COUNT=7;
const WIRE_SLOT_Y=Array.from({length:WIRE_SLOT_COUNT},(_,i)=>WIRE_SLOT_TOP+WIRE_SLOT_STEP*i);

const STAGE_WIRE_LAYOUTS=[
  // MAP 0-1：7レーンを固定。開始時はレーン3〜6の4本。
  {until:100,types:['CORE','LOWER','CHARGE','HIGH SPEED'],slots:[2,3,4,5]},
  // 100m：レーン2にUPPERを追加。既存の電線は一切移動しない。
  {until:200,types:['UPPER','CORE','LOWER','CHARGE','HIGH SPEED'],slots:[1,2,3,4,5]},
  // 200m：レーン4の普通の電線（LOWER）を削除。レーン5以降はそのままの位置。
  {until:400,types:['UPPER','CORE','CHARGE','HIGH SPEED'],slots:[1,2,4,5]},
  // 400m：レーン4（slot 3）に通常電線を追加。既存電線の位置は変更しない。
  {until:Infinity,types:['UPPER','CORE','LOWER','CHARGE','HIGH SPEED'],slots:[1,2,3,4,5]}
];

// 電線の追加・削除イベント。
// 追加は2秒前、削除は3秒前からレーンで予告する。
// 電線はイベント地点より十分手前からワールド上に存在する。
const STAGE_WIRE_ADDITIONS=[
  {type:'UPPER',targetM:100,slot:1,spawnAheadM:60},
  {type:'LOWER',targetM:400,slot:3,spawnAheadM:60}
];
const STAGE_WIRE_REMOVALS=[
  {type:'LOWER',targetM:200,slot:4,warningSec:3}
];

const WIRE_TYPES={
  UPPER:{label:'UPPER',glow:'#56eaff'},
  CORE:{label:'CORE',glow:'#7cf2ff'},
  LOWER:{label:'LOWER',glow:'#48d9f3'},
  CHARGE:{label:'CHARGE',glow:'#35e23c',chargeMul:2.0},
  'HIGH SPEED':{label:'HIGH SPEED',glow:'#ff4055',speedMul:2}
};

let wires=[];
let currentLayoutKey='';
function layoutForDistance(d){
  for(let i=0;i<STAGE_WIRE_LAYOUTS.length;i++){
    if(d<STAGE_WIRE_LAYOUTS[i].until)return STAGE_WIRE_LAYOUTS[i];
  }
  return STAGE_WIRE_LAYOUTS[STAGE_WIRE_LAYOUTS.length-1];
}
function buildWires(types,slots){
  return types.map((type,i)=>{
    const base=WIRE_TYPES[type]||WIRE_TYPES.CORE;
    const slot=(slots&&slots[i]!=null)?slots[i]:(2+i);
    return {
      type,
      slot,
      y:WIRE_SLOT_Y[Math.max(0,Math.min(WIRE_SLOT_COUNT-1,slot))],
      label:base.label,
      glow:base.glow,
      chargeMul:base.chargeMul||1,
      speedMul:base.speedMul||1
    };
  });
}
function applyStageWireLayout(force=false){
  const d=distanceMeters();
  const layout=layoutForDistance(d);
  const key=layout.types.join('|')+'@'+layout.slots.join(',');
  if(!force && key===currentLayoutKey)return;
  const oldWire=wires[state.wire];
  const oldType=oldWire?.type;
  const oldY=oldWire?.y;
  const oldSlot=oldWire?.slot;
  wires=buildWires(layout.types,layout.slots);
  currentLayoutKey=key;
  let next=wires.findIndex(w=>w.type===oldType);
  if(next<0){
    // 現在の電線が削除された場合だけ、最も近い残存レーンへ退避する。
    // 既存の残存電線のslotは一切変更しない。
    const fallbackSlot=oldSlot!=null?oldSlot:3;
    let best=0,bestDist=Infinity;
    wires.forEach((w,i)=>{
      const dd=Math.abs(w.slot-fallbackSlot);
      if(dd<bestDist){bestDist=dd;best=i;}
    });
    next=best;
  }
  state.wire=next;
  state.wireVisual=next;
  player.targetY=wires[next].y;
  if(force) player.y=wires[next].y;
  else if(oldY!=null && oldType===wires[next]?.type) player.y=oldY;
  else player.y=wires[next].y;
}
const player={x:160,y:410,targetY:410,r:13,phase:0};

function showMessage(text){const e=document.getElementById('message');e.textContent=text;e.style.opacity=1;clearTimeout(showMessage.timer);showMessage.timer=setTimeout(()=>e.style.opacity=0,1100)}
function virusSpacingOK(type,x,extraMin=220){
  for(const v of state.viruses){
    if(v.laneType===type || adjacentWireTypes(type,v.laneType)){
      if(Math.abs(v.x-x)<extraMin)return false;
    }
  }
  return true;
}
function adjacentWireTypes(a,b){
  if(a===b)return true;
  const wa=wires.find(w=>w.type===a), wb=wires.find(w=>w.type===b);
  return !!wa && !!wb && Math.abs(wa.slot-wb.slot)===1;
}
function nextWireIndexByLane(dir){
  const current=wires[state.wire];
  if(!current)return state.wire;
  const targetSlot=current.slot+dir;
  // 空いているレーンを飛び越え、同じ方向で最初に存在する電線へ移動する。
  const candidates=wires
    .map((w,i)=>({w,i}))
    .filter(({w})=>dir<0?w.slot<current.slot:w.slot>current.slot)
    .sort((a,b)=>dir<0?b.w.slot-a.w.slot:a.w.slot-b.w.slot);
  const next=candidates[0];
  return next?next.i:state.wire;
}
function generateHazardsRange(startX,endX,reset=false){
  if(reset){state.viruses.length=0;state.energies.length=0;}
  const startM=Math.max(0,Math.floor((startX-160)/110));
  const endM=Math.max(startM+1,Math.floor((endX-160)/110));
  const layout=layoutForDistance(startM);
  const types=layout.types;
  for(const type of types){
    if(type==='UPPER')continue;
    if((state.designated.phase==='active'||state.designated.phase==='penalty') && type===wires[state.designated.lane]?.type)continue;
    let x=startX+Math.random()*220;
    const count=Math.max(0,Math.ceil((endX-startX)/900));
    for(let i=0;i<count;i++){
      let candidate=Math.min(endX-180,x+500+Math.random()*700);
      let tries=0;
      while(tries<80 && !virusSpacingOK(type,candidate,220)){
        candidate+=220+Math.random()*320;
        tries++;
      }
      if(candidate>endX-120)break;
      const red=Math.random()<0.4;
      state.viruses.push({x:candidate,y:0,laneType:type,r:11.4,phase:Math.random()*Math.PI*2,red});
      x=candidate;
    }
  }
  // ENERGYは1目盛ごとに5%。ウイルスの近傍には置かない。
  for(const type of types){
    for(let x=Math.ceil(startX/110)*110;x<endX;x+=110){
      if(Math.random()>=0.10)continue;
      const blocked=state.viruses.some(v=>v.laneType===type && Math.abs(v.x-x)<120);
      if(!blocked)state.energies.push({x,y:0,laneType:type,r:6.84,phase:Math.random()*Math.PI*2});
    }
  }
  state.viruses.sort((a,b)=>a.x-b.x);
  state.energies.sort((a,b)=>a.x-b.x);
}
function generateViruses(){
  // β2.27.8: ステージレイアウトに応じた電線構成。7枠の固定スペースを使用。
  // 同じ電線だけでなく、隣り合う上下の電線同士も2目盛(220px)以上離す。

function extendWorldIfNeeded(){

function wireAtWorldX(x,type){

function checkEnergyCollection(){

function clearDesignatedHazards(){
  if(state.designated.lane<0)return;
  const targetType=wires[state.designated.lane]?.type;
  if(!targetType)return;
  // 大電流中にトールが通過する範囲だけを一時的に空ける。
  // 旧版のように電線全体のマルウェアを削除すると、イベント終了後も
  // その電線の遠方まで空白になってしまうため、現在地から少し先だけを対象にする。
  const currentSpeed=Math.max(1,state.speed*speedProgress()*distanceAcceleration()*(wires[state.wire]?.speedMul||1));
  const clearAhead=currentSpeed*(3+3)+500; // 大電流3秒＋TIME UP後3秒＋余裕
  const minX=player.x-180;
  const maxX=player.x+clearAhead;
  state.viruses=state.viruses.filter(v=>v.laneType!==targetType || v.x<minX || v.x>maxX);
  state.energies=state.energies.filter(e=>e.laneType!==targetType || e.x<minX || e.x>maxX);
}
function regenerateLaneHazards(type,startX,endX){
  if(!type || endX<=startX)return;
  // 通常の generateHazardsRange と同じルールで、指定電線だけを再生成する。
  if(type!=='UPPER'){
    let x=startX+Math.random()*220;
    const count=Math.max(0,Math.ceil((endX-startX)/900));
    for(let i=0;i<count;i++){
      let candidate=Math.min(endX-180,x+500+Math.random()*700);
      let tries=0;
      while(tries<80 && !virusSpacingOK(type,candidate,220)){
        candidate+=220+Math.random()*320;
        tries++;
      }
      if(candidate>endX-120)break;
      const red=Math.random()<0.4;
      state.viruses.push({x:candidate,y:0,laneType:type,r:11.4,phase:Math.random()*Math.PI*2,red});
      x=candidate;
    }
  }
  for(let x=Math.ceil(startX/110)*110;x<endX;x+=110){
    if(Math.random()>=0.10)continue;
    const blocked=state.viruses.some(v=>v.laneType===type && Math.abs(v.x-x)<120);
    if(!blocked)state.energies.push({x,y:0,laneType:type,r:6.84,phase:Math.random()*Math.PI*2});
  }
  state.viruses.sort((a,b)=>a.x-b.x);
  state.energies.sort((a,b)=>a.x-b.x);
}
function endDesignated(success=false){
  const finishedLane=state.designated.lane;
  const finishedType=wires[finishedLane]?.type;
  state.designated.phase='idle';
  state.designated.timer=0;
  state.designated.maxTime=0;
  state.designated.elapsed=0;
  state.designated.penaltyTimer=0;

  // 大電流は10m、300m、600m…と300mごとに一度だけ発動する。
  // 今回のイベントが終わったら、次の発動地点を300m先へ進める。
  state.designated.nextM+=300;
  state.designated.targetX=160+state.designated.nextM*110;
  state.designated.lane=-1;

  const hud=document.getElementById('designatedHud');
  hud.style.display='none';
  document.getElementById('designatedWarning').className='';
  document.getElementById('designatedCount').textContent='';

  // イベント中に一時的に空けた範囲だけを、通常の抽選ルールで再生成する。
  // 遠方に元から存在していたウイルス・エナジーは削除していないので、
  // イベント終了後もそのまま通常通り残り続ける。
  const resumeStart=Math.max(900,player.x+220);
  const resumeEnd=Math.min(state.worldW-1200,player.x+2600);
  if(finishedType && resumeEnd>resumeStart)regenerateLaneHazards(finishedType,resumeStart,resumeEnd);

  if(success)showMessage('大電流 // SUCCESS');
}
function triggerDesignated(){
  if(!state.running || state.designated.phase!=='warning')return;
  state.designated.phase='active';
  const startLane=state.wire;
  // 大電流の指定電線にはHIGH SPEED電線を選ばない。
  // まずHIGH SPEEDを除外し、その中で大電流開始時のトールから
  // なるべく離れた電線（最遠＋その次に遠い候補）からランダムに選ぶ。
  const selectable=wires.map((w,i)=>({w,i})).filter(({w})=>w.type!=='HIGH SPEED');
  const maxDist=Math.max(...selectable.map(({i})=>Math.abs(i-startLane)));
  const farCandidates=selectable.map(({i})=>i).filter(i=>Math.abs(i-startLane)>=Math.max(0,maxDist-1));
  state.designated.lane=farCandidates[Math.floor(Math.random()*farCandidates.length)];
  state.designated.timer=3;
  state.designated.maxTime=3;
  state.designated.elapsed=0;
  clearDesignatedHazards();
  const hud=document.getElementById('designatedHud');
  const warn=document.getElementById('designatedWarning');
  warn.style.display='none';
  warn.className='';
  const count=document.getElementById('designatedCount');
  count.textContent=state.designated.timer.toFixed(1)+'s';
  count.className='';
  hud.style.display='block';
  showMessage('大電流を選択 // '+(state.designated.lane+1)+'本目');
}

function updateDesignated(dt){
  if(!state.running)return;
  const d=distanceMeters();
  if(state.designated.phase==='idle' && state.designated.targetX!==null){
    const currentSpeed=Math.max(1,state.speed*speedProgress()*distanceAcceleration()*(wires[state.wire]?.speedMul||1)*(state.infectionType==='vision'&&state.infectionTimer>0?1:1));
    const warningDistance=Math.max(0,currentSpeed*2/110);
    if(d*110+160 >= state.designated.targetX-warningDistance*110)startDesignatedWarning();
  }
  if(state.designated.phase==='warning' && player.x>=state.designated.targetX)triggerDesignated();
  if(state.designated.phase==='active'){
    // 大電流に移動してもイベントは成功終了しない。カウントダウンは最後まで続く。
    // 大電流そのものの位置も変更しない。
    state.designated.elapsed+=dt;
    state.designated.timer=Math.max(0,state.designated.timer-dt);
    const count=document.getElementById('designatedCount');
    count.className='';
    count.textContent=state.designated.timer.toFixed(1)+'s';
    if(state.designated.timer<=0){
      state.designated.phase='penalty';
      state.designated.penaltyTimer=3;
      count.textContent='';
      count.className='';
      showMessage('大電流終了');
    }
  }else if(state.designated.phase==='penalty'){
    // タイムアップ後、このオレンジ/黒の状態を3秒間そのまま保持する。
    // この3秒間は大電流側の新規マルウェア生成も停止する。
    // 黒い電線に移動した瞬間ゲームオーバー。
    if(state.wire!==state.designated.lane){
      // 黒い電線に触れた瞬間ではなく、0.7秒の感電演出を見せてからゲームオーバー。
      startElectrocution();
      return;
    }
    // タイムアップ後3秒間は表示上のカウントダウンを行わず、TIME UPも表示しない。
    state.designated.penaltyTimer=Math.max(0,state.designated.penaltyTimer-dt);
    document.getElementById('designatedCount').textContent='';
    document.getElementById('designatedCount').className='';
    if(state.designated.penaltyTimer<=0)endDesignated(false);
  }
}
function switchWire(dir){
  if(state.shockTimer>0 || !state.running)return;

  if(next===state.wire)return;
  state.wire=next;

  player.targetY=wires[next].y;
  state.wireVisual=next;
  state.wirePulse=1;
  showMessage('LANE '+(wires[next].slot+1)+' // '+wires[next].label);
}

function worldX(x){return x-state.cam}
function distanceMeters(){return Math.max(0,Math.floor((player.x-160)/110));}
function speedProgress(){
  const d=distanceMeters();
  if(d<=30)return 0.70;
  if(d>=100)return 1.00;
  return 0.70+(d-30)/70*0.30;
}
// 走行距離1mにつき、トールの速度を0.01%ずつ加速。
function distanceAcceleration(){
  return 1 + distanceMeters() * 0.0001;
}
function wireY(i){return wires[i].y}
function rect(x,y,w,h,fill,stroke){ctx.fillStyle=fill;ctx.fillRect(worldX(x),y,w,h);if(stroke){ctx.strokeStyle=stroke;ctx.strokeRect(worldX(x)+.5,y+.5,w-1,h-1)}}
function line(x1,y1,x2,y2,style,width){ctx.beginPath();ctx.moveTo(worldX(x1),y1);ctx.lineTo(worldX(x2),y2);ctx.strokeStyle=style;ctx.lineWidth=width;ctx.stroke()}
function addParticles(){
  if(Math.random()<.75){const y=wireY(state.wire);state.particles.push({x:player.x-10-Math.random()*30,y:y+(Math.random()-.5)*8,vx:-2-Math.random()*4,life:20+Math.random()*18,max:38})}
  if(state.particles.length>120)state.particles.splice(0,state.particles.length-120);
}
function update(dt){
  state.t+=dt;
  if(state.shockTimer>0){
    state.shockTimer=Math.max(0,state.shockTimer-dt);
    state.shake=Math.max(state.shake,.08);
    if(state.shockTimer<=0)finishGameOver();
    return;
  }
  if(state.damageTimer>0)state.damageTimer=Math.max(0,state.damageTimer-dt);
  if(state.infectionTimer>0){
    state.infectionTimer=Math.max(0,state.infectionTimer-dt);
    const ig=document.getElementById('infectionGaugeFill');
    ig.style.width=(state.infectionMax>0?Math.max(0,state.infectionTimer/state.infectionMax*100):0)+'%';
    if(state.infectionTimer===0)endInfection();
  }
  if(state.infectionFade>0)state.infectionFade=Math.max(0,state.infectionFade-dt/0.7);
  if(state.busterActive>0){
    state.busterActive=Math.max(0,state.busterActive-dt);
    state.busterCharge=Math.max(0,30*(state.busterActive/state.busterMax));
    updateEnergyGauge();
    if(state.busterActive===0){state.busterCharge=0;updateEnergyGauge();showMessage('VIRUS BUSTER END');}
  }
  state.shake=Math.max(0,state.shake-dt);
  // 100mで、元々100m地点にあるUPPER電線を見せる演出を開始する。
  extendWorldIfNeeded();
  applyStageWireLayout();
  // β2.23.8: 視界不良中もトールの速度は通常の100%。電線固有の速度補正は維持する。
  const visionSpeedMul=(state.infectionTimer>0 && state.infectionType==='vision')?1:1;
  const busterSpeedMul=state.busterActive>0?1.10:1;
  const moveSpeed=state.speed*speedProgress()*distanceAcceleration()*(wires[state.wire].speedMul||1)*visionSpeedMul*busterSpeedMul; player.x+=moveSpeed*dt;
  updateDesignated(dt);
  if(!state.running)return;
  player.phase+=dt*0.12;
  // 上下の電線切り替えを滑らかにアニメーション。約0.14秒で到達する。
  const dy=player.targetY-player.y;
  const step=Math.max(1,Math.abs(dy)*Math.min(1,dt/0.07));
  if(Math.abs(dy)<=step) player.y=player.targetY;
  else player.y += Math.sign(dy)*step;
  state.wireVisual=state.wire;
  state.wirePulse=Math.max(0,state.wirePulse-dt*3.5);
  state.cam=Math.max(0,player.x-W*.20);
  state.cam=Math.min(state.cam,Math.max(0,state.worldW-W*.78));
  if(state.battery<3 && !(state.infectionTimer>0 && state.infectionType==='charging')){
    // CHARGE電線では通常の200%の速度で充電する。充電不可感染中は従来通り停止。
    state.charge+=dt*(wires[state.wire].chargeMul||1);
    if(state.charge>=10){state.battery=Math.min(3,state.battery+1);state.charge=0;updateBatteryHud();showMessage('BATTERY +1 // CHARGED');}
  }else{state.charge=0;}
  updateBatteryHud();
  checkVirusCollision();
  checkEnergyCollection();
  addParticles();
  for(let i=state.particles.length-1;i>=0;i--){const p=state.particles[i];p.x+=p.vx*dt*4;p.y+=p.vy*dt*4;p.life-=dt*60;if(p.life<=0)state.particles.splice(i,1)}
}

function drawBackground(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#02070c');g.addColorStop(.5,'#06121a');g.addColorStop(1,'#020609');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const grid=80;const off=-(state.cam*.18)%grid;
  ctx.strokeStyle='rgba(66,151,169,.09)';ctx.lineWidth=1;
  for(let x=off;x<W+grid;x+=grid){ctx.beginPath();ctx.moveTo(x,64);ctx.lineTo(x,H-150);ctx.stroke()}
  for(let y=100;y<H-150;y+=55){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  for(let i=0;i<12;i++){
    const x=((i*510-state.cam*.32)%(W+700))-100;
    const h=90+(i%5)*36;ctx.fillStyle='rgba(18,42,51,.42)';ctx.fillRect(x, H-150-h, 130, h);
    ctx.fillStyle='rgba(69,153,166,.08)';ctx.fillRect(x+16,H-140-h,3,h-20);ctx.fillRect(x+42,H-140-h,3,h-40);ctx.fillRect(x+78,H-140-h,3,h-10);
  }
  ctx.fillStyle='rgba(83,220,240,.08)';ctx.font='bold 52px Arial';ctx.fillText('SECTOR 02',worldX(1600),170);ctx.font='bold 18px Arial';ctx.fillText('CONDUIT NETWORK // DYNAMIC',worldX(1670),195);
}
function drawWireAdditions(){
  // β2.27.5：斜めの電線演出は削除。
  // 電線はあらかじめ生成され、追加時は水平電線として出現する。
}

function drawWire(y,glow,label,i){
  const designated=(state.designated.phase==='active'||state.designated.phase==='penalty') && i===state.designated.lane;
  const blackout=state.designated.phase==='penalty' && i!==state.designated.lane;
  const active=state.designated.phase==='active' && designated;
  let blinkOn=true;
  if(active){
    // 大電流は0.25秒周期で、元の電線色とオレンジを交互に点滅。
    blinkOn=(Math.floor(state.designated.elapsed/0.25)%2)===0;
  }

  let bodyGlow=glow;
  let bodyCore=glow;
  let shadow=glow;
  let labelColor='rgba(113,221,234,.28)';
  if(blackout){
    bodyGlow='#080b0d';
    bodyCore='rgba(20,20,20,.95)';
    shadow='rgba(0,0,0,0)';
  }else if(designated){
    bodyGlow=active && !blinkOn ? glow : '#ff9d32';
    bodyCore=active && !blinkOn ? glow : '#ffbf66';
    shadow='#ff8b24';
  }

  ctx.shadowBlur=blackout?0:24;
  ctx.shadowColor=shadow;
  line(0,y,state.worldW,y,blackout?'rgba(8,10,12,.95)':'rgba(37,86,100,.8)',13);
  line(0,y,state.worldW,y,bodyGlow,5);
  ctx.shadowBlur=0;
  line(0,y,state.worldW,y,bodyCore,1);
  // タイムアップ後の黒電線には、濃い青と薄い青の2色の電流が流れる。
  if(blackout){
    ctx.save();
    ctx.lineWidth=1.5;
    ctx.lineCap='round';
    const streams=[
      {speed:150,offset:0,color:'rgba(28,92,180,.92)',glow:'rgba(24,91,180,.38)'},
      {speed:105,offset:55,color:'rgba(116,218,255,.86)',glow:'rgba(86,199,255,.34)'}
    ];
    for(const stream of streams){
      ctx.strokeStyle=stream.color;
      ctx.shadowBlur=6;
      ctx.shadowColor=stream.glow;
      const flow=((state.t*stream.speed+stream.offset)%110);
      for(let base=Math.floor(state.cam/110)*110-110+flow;base<state.cam+W*2;base+=110){
        const sx=worldX(base);
        const yy=y+(stream.offset?1:-1);
        ctx.beginPath();
        ctx.moveTo(sx,yy);
        ctx.lineTo(sx+9,yy-4);
        ctx.lineTo(sx+17,yy+4);
        ctx.lineTo(sx+27,yy-5);
        ctx.lineTo(sx+38,yy+3);
        ctx.lineTo(sx+48,yy);
        ctx.stroke();
      }
    }
    ctx.restore();
  }


  for(let x=Math.floor(state.cam/110)*110;x<state.cam+W*2+110;x+=110){
    const sx=worldX(x);
    let tickColor='rgba(165,249,255,.85)';
    let tickGlow='rgba(84,224,242,.25)';
    if(blackout){
      tickColor='rgba(20,20,20,.9)';
      tickGlow='rgba(10,10,10,.7)';
      labelColor='rgba(40,40,40,.5)';
    }else if(designated){
      if(!active || blinkOn){
        tickColor='rgba(255,205,145,.95)';
        tickGlow='rgba(255,151,53,.55)';
        labelColor='rgba(255,174,78,.95)';
      }
    }
    ctx.fillStyle=tickColor;
    ctx.fillRect(sx-2,y-8,4,16);
    ctx.fillStyle=tickGlow;
    ctx.fillRect(sx-7,y-2,14,4);
  }
  ctx.fillStyle=labelColor;
  ctx.font='10px Arial';
  ctx.fillText(label,worldX(40),y-16);
}
function drawPlayer(){
  const y=player.y;const x=worldX(player.x);
  if(state.damageTimer>0 && Math.floor(state.damageTimer*12)%2===0)return;
  const infected=state.infectionTimer>0;
  const buster=state.busterActive>0;
  const shocked=state.shockTimer>0;
  const fade=state.infectionFade;
  ctx.save();ctx.translate(x,y);ctx.rotate(-.08);
  if(buster){const bp=.62+.18*Math.sin(state.t*10);ctx.save();ctx.globalAlpha=bp;ctx.strokeStyle='#ff9d32';ctx.lineWidth=4;ctx.shadowBlur=22;ctx.shadowColor='#ff7b16';ctx.beginPath();ctx.arc(0,0,31+Math.sin(state.t*6)*2,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=.20;ctx.fillStyle='#ff8a24';ctx.beginPath();ctx.arc(0,0,29,0,Math.PI*2);ctx.fill();ctx.restore();}
  ctx.shadowBlur=shocked?30:22;
  ctx.shadowColor=shocked?'#208cff':(buster?'#ff9d32':(infected?'#c88cff':'#7df3ff'));
  ctx.fillStyle=shocked?'#4aa8ff':(buster?'#ff9d32':(infected?'#cfa8e8':'#dfffff'));
  if(fade>0 && !shocked){
    const t=fade;
    ctx.fillStyle=`rgb(${Math.round(223+(207-223)*t)},${Math.round(255+(168-255)*t)},${Math.round(255+(232-255)*t)})`;
    ctx.shadowColor='#7df3ff';
  }
  ctx.beginPath();ctx.moveTo(-17,0);ctx.lineTo(-3,-10);ctx.lineTo(11,-7);ctx.lineTo(16,0);ctx.lineTo(8,8);ctx.lineTo(-5,9);ctx.closePath();ctx.fill();
  ctx.fillStyle='#5ee5ff';ctx.fillRect(-3,-4,10,4);ctx.fillStyle='#ffffff';ctx.fillRect(6,-2,5,3);
  ctx.fillStyle='rgba(104,235,255,.7)';ctx.beginPath();ctx.moveTo(-17,0);ctx.lineTo(-27,-5);ctx.lineTo(-20,3);ctx.closePath();ctx.fill();
  // 顔：通常は縦線の目、ダメージ中は「> <」の痛がる表情
  ctx.shadowBlur=5;ctx.shadowColor=shocked?'#b8e9ff':'#2aa8ff';ctx.strokeStyle=shocked?'#d8f5ff':'#2aa8ff';ctx.lineWidth=2.2;ctx.lineCap='round';ctx.beginPath();
  if(shocked){
    // 感電中は目も含めて青白く震える表現。
    ctx.moveTo(1,-4);ctx.lineTo(5,0);ctx.lineTo(1,4);
    ctx.moveTo(11,-4);ctx.lineTo(7,0);ctx.lineTo(11,4);
  }else if(state.damageTimer>0){
    ctx.moveTo(1,-4);ctx.lineTo(5,0);ctx.lineTo(1,4);
    ctx.moveTo(11,-4);ctx.lineTo(7,0);ctx.lineTo(11,4);
  }else{
    ctx.moveTo(3,-4);ctx.lineTo(3,3);
    ctx.moveTo(10,-4);ctx.lineTo(10,3);
  }
  ctx.stroke();
  if(shocked){
    const pulse=0.65+0.35*Math.sin(state.t*32);
    ctx.save();
    ctx.globalAlpha=pulse;
    ctx.lineWidth=2.2;
    ctx.strokeStyle='#218cff';
    ctx.shadowBlur=12;
    ctx.shadowColor='#1b7dff';
    const arcs=[
      [[-22,-13],[-14,-5],[-20,3],[-12,12]],
      [[20,-15],[13,-6],[21,1],[14,12]],
      [[-7,-19],[-2,-11],[-6,-4],[1,3]],
      [[7,18],[2,10],[8,3],[3,-4]]
    ];
    for(const pts of arcs){
      ctx.beginPath();
      ctx.moveTo(pts[0][0],pts[0][1]);
      for(let j=1;j<pts.length;j++)ctx.lineTo(pts[j][0],pts[j][1]);
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();
  ctx.shadowBlur=0;
  if(Math.random()<.35){ctx.fillStyle='#dfffff';ctx.fillRect(x-10+(Math.random()*20),y-15+(Math.random()*30),2,2)}
  // BUSTER: barrier electric arcs
  if (buster) {
    ctx.save();
    const t = performance.now() / 1000;
    const cx = px, cy = py;
    ctx.lineWidth = 2.2;
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = "#ffb000";
    for (let k = 0; k < 7; k++) {
      const a0 = t * 3.2 + k * (Math.PI * 2 / 7);
      const a1 = a0 + 0.55 + Math.sin(t * 8 + k) * 0.12;
      ctx.beginPath();
      const r0 = 25 + 2 * Math.sin(t * 9 + k);
      const r1 = 31 + 3 * Math.sin(t * 11 + k * 1.7);
      ctx.moveTo(cx + Math.cos(a0) * r0, cy + Math.sin(a0) * r0);
      const steps = 5;
      for (let s = 1; s <= steps; s++) {
        const p = s / steps;
        const a = a0 + (a1 - a0) * p;
        const r = r0 + (r1 - r0) * p;
        const jitter = (Math.random() - 0.5) * 5;
        ctx.lineTo(cx + Math.cos(a) * (r + jitter), cy + Math.sin(a) * (r + jitter));
      }
      ctx.stroke();
    }
    ctx.restore();
  }

}
function drawVirus(v){
  const y=entityY(v); if(y===null)return;
  const x=worldX(v.x);
  if(x<-50||x>W*2+50)return;
  ctx.save();ctx.translate(x,y);ctx.rotate(v.phase+state.t*.18);ctx.scale(.6,.6);
  ctx.shadowBlur=18;ctx.shadowColor=v.red?'rgba(255,55,70,.9)':'rgba(180,70,255,.8)';
  // トゲトゲしたウイルス外殻
  ctx.fillStyle=v.red?'#d51f3a':'#7b2cbf';ctx.strokeStyle=v.red?'#ff8a96':'#c77dff';ctx.lineWidth=2;
  ctx.beginPath();
  for(let i=0;i<16;i++){const a=i*Math.PI/8;const rr=i%2?20:29;const px=Math.cos(a)*rr,py=Math.sin(a)*rr;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.shadowBlur=0;ctx.fillStyle=v.red?'#751326':'#4a176f';ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.fill();
  // ウイルスの突起
  for(let i=0;i<8;i++){const a=i*Math.PI/4;const bx=Math.cos(a)*21,by=Math.sin(a)*21;ctx.strokeStyle=v.red?'#ff9ca5':'#d896ff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(Math.cos(a)*30,Math.sin(a)*30);ctx.stroke();ctx.fillStyle=v.red?'#ffc0c6':'#e5b3ff';ctx.beginPath();ctx.arc(Math.cos(a)*31,Math.sin(a)*31,3,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle=v.red?'#ffe0e3':'#f0d0ff';ctx.beginPath();ctx.arc(-5,-4,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(7,5,3,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawViruses(){for(const v of state.viruses)drawVirus(v);}
function drawEnergy(e){
  const y=entityY(e); if(y===null)return;
  const x=worldX(e.x);
  if(x<-40||x>W*2+40)return;
  const s=1+Math.sin(state.t*7+e.phase)*.08;
  ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);ctx.scale(s,s);
  ctx.shadowBlur=18;ctx.shadowColor='#c8f8ff';
  ctx.fillStyle='#d8fbff';ctx.fillRect(-6.84,-6.84,13.68,13.68);
  ctx.fillStyle='#7eeeff';ctx.fillRect(-4.3,-4.3,8.6,8.6);
  ctx.strokeStyle='rgba(240,255,255,.95)';ctx.lineWidth=1.5;ctx.strokeRect(-6.84,-6.84,13.68,13.68);
  ctx.restore();ctx.shadowBlur=0;
}
function drawEnergies(){for(const e of state.energies)drawEnergy(e);}
function drawParticles(){for(const p of state.particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle='#bffcff';ctx.fillRect(worldX(p.x),p.y,2,2)}ctx.globalAlpha=1}
function drawStations(){
  // β2.27.8：レーンは電線とは完全に別の背景要素。
  // 画面左右端に常時固定し、上からレーン1〜7として扱う（番号は表示しない）。
  const laneCount=WIRE_SLOT_COUNT;
  const upcoming=[];
  const currentSpeed=Math.max(1,state.speed*speedProgress()*distanceAcceleration()*(wires[state.wire]?.speedMul||1));

  for(const add of STAGE_WIRE_ADDITIONS){
    const targetX=160+add.targetM*110;
    const seconds=(targetX-player.x)/currentSpeed;
    if(seconds>0 && seconds<=2){
      const type=WIRE_TYPES[add.type]||WIRE_TYPES.CORE;
      upcoming.push({laneIndex:add.slot,kind:'add',glow:type.glow,seconds});
    }
  }
  for(const rem of STAGE_WIRE_REMOVALS){
    const targetX=160+rem.targetM*110;
    const seconds=(targetX-player.x)/currentSpeed;
    if(seconds>0 && seconds<=3){
      upcoming.push({laneIndex:rem.slot,kind:'remove',seconds});
    }
  }

  // β2.27.7の50%から70%へ。角型の機械フレーム＋回路端子で世界観に合わせる。
  // β2.27.10：レーンサイズを60%に縮小（β2.27.8の70%基準から比例縮小）。
  const laneW=11.5;
  const laneH=16.5;
  const leftX=0;
  const rightX=W-laneW;

  for(let i=0;i<laneCount;i++){
    const y=H*.25+WIRE_SLOT_Y[i]*.5;
    const notice=upcoming.find(u=>u.laneIndex===i);
    const blinkOn=Math.floor(state.t*5)%2===0;
    const addLit=notice?.kind==='add' && blinkOn;
    const removeDark=notice?.kind==='remove' && blinkOn;

    ctx.save();
    ctx.lineJoin='miter';
    ctx.lineCap='square';

    let stroke='rgba(215,246,250,.82)';
    let width=1.5;
    if(addLit){
      stroke=notice.glow;
      width=3.0;
    }else if(notice?.kind==='add'){
      stroke='rgba(190,236,242,.95)';
      width=1.8;
    }else if(removeDark){
      stroke='rgba(0,0,0,.98)';
      width=3.0;
    }else if(notice?.kind==='remove'){
      stroke='rgba(175,202,207,.62)';
      width=1.2;
    }

    ctx.strokeStyle=stroke;
    ctx.lineWidth=width;
    ctx.shadowBlur=addLit?24:0;
    ctx.shadowColor=addLit?notice.glow:'transparent';

    // 左右端に固定されたレーンフレーム。中央の切れ込みが電線の通過ポート。
    function frame(x,flip){
      ctx.beginPath();
      if(!flip){
        ctx.moveTo(x+3.5,y-laneH/2);ctx.lineTo(x+laneW,y-laneH/2);
        ctx.lineTo(x+laneW,y+laneH/2);ctx.lineTo(x+3.5,y+laneH/2);
        ctx.moveTo(x+3.5,y-laneH/2);ctx.lineTo(x,y-laneH/2+3.5);
        ctx.lineTo(x,y+laneH/2-3.5);ctx.lineTo(x+3.5,y+laneH/2);
      }else{
        ctx.moveTo(x+laneW-3.5,y-laneH/2);ctx.lineTo(x,y-laneH/2);
        ctx.lineTo(x,y+laneH/2);ctx.lineTo(x+laneW-3.5,y+laneH/2);
        ctx.moveTo(x+laneW-3.5,y-laneH/2);ctx.lineTo(x+laneW,y-laneH/2+3.5);
        ctx.lineTo(x+laneW,y+laneH/2-3.5);ctx.lineTo(x+laneW-3.5,y+laneH/2);
      }
      ctx.stroke();
    }
    frame(leftX,false);frame(rightX,true);

    // 中央ポート：追加予告時だけ、追加される電線色で強く点滅。
    ctx.lineWidth=addLit?4.5:1.8;
    ctx.beginPath();ctx.moveTo(leftX,y);ctx.lineTo(leftX+laneW,y);ctx.stroke();
    ctx.beginPath();ctx.moveTo(rightX,y);ctx.lineTo(W,y);ctx.stroke();

    // 小さな端子を追加。
    ctx.lineWidth=1;
    ctx.globalAlpha=addLit?.95:.55;
    for(const side of [leftX,rightX]){
      const inner=side===leftX?side+3:side+laneW-3;
      const dir=side===leftX?1:-1;
      ctx.beginPath();ctx.moveTo(inner,y-laneH/2+6);ctx.lineTo(inner+dir*3.5,y-laneH/2+3);ctx.stroke();
      ctx.beginPath();ctx.moveTo(inner,y+laneH/2-6);ctx.lineTo(inner+dir*3.5,y+laneH/2-3);ctx.stroke();
    }
    ctx.restore();
  }
}
function drawSwitchEffect(){if(state.wirePulse<=0)return;const y=wireY(state.wireVisual),x=worldX(player.x);ctx.globalAlpha=state.wirePulse;ctx.strokeStyle='#eaffff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,25+(1-state.wirePulse)*30,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}
function drawGoal(){const x=worldX(state.worldW-220);for(let i=0;i<5;i++){ctx.fillStyle='rgba(85,232,255,'+(0.15+i*.08)+')';ctx.fillRect(x+i*12,150-i*8,3,H-300+i*16)}ctx.fillStyle='#cfffff';ctx.font='bold 13px Arial';ctx.fillText('EXIT',x+18,128);ctx.font='10px Arial';ctx.fillStyle='#74b6c0';ctx.fillText('RUN TO THE END',x+18,145)}
function render(){
  ctx.save();
  if(state.shake>0){const amp=8*(state.shake/.65);ctx.translate((Math.random()-.5)*amp,(Math.random()-.5)*amp);}
  drawBackground();
  // レーンは画面固定の背景要素。ワールド変換の前に描画する。
  drawStations();
  ctx.save();
  // β2.27.8：7本分の固定スペースを常に使うため、電線増減でズームを変更しない。
  const viewScale=.5;
  ctx.translate(W*.12,H*.25);ctx.scale(viewScale,viewScale);
  drawWireAdditions();
  wires.forEach((w,i)=>drawWire(w.y,w.glow,w.label,i));
  drawViruses();drawEnergies();drawParticles();drawPlayer();drawSwitchEffect();
  ctx.restore();
  if(state.infectionType==='vision' && state.infectionTimer>0){
    // 視界不良：トールから半径2.5目盛だけ通常表示。
    // 1目盛=110pxワールド、描画倍率50%なので、2.5目盛=137.5px画面距離。
    // 重要：destination-outで既に描いたゲーム画面を消すのではなく、
    // 円の「外側だけ」に暗幕を描く。これで円の内側は完全に元の画面を維持する。
    const vx=W*.12+worldX(player.x)*.5;
    const vy=H*.25+player.y*.5;
    const vr=137.5;
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,.96)';
    ctx.beginPath();
    ctx.rect(0,0,W,H);
    ctx.arc(vx,vy,vr,0,Math.PI*2,true);
    // evenoddで「画面全体－円」の領域だけを塗る。
    ctx.fill('evenodd');
    ctx.restore();
  }
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(0,H-150,W,150);
  ctx.strokeStyle='rgba(92,224,241,.13)';ctx.beginPath();ctx.moveTo(0,H-150);ctx.lineTo(W,H-150);ctx.stroke();
  if(state.running){ctx.fillStyle='#dfffff';ctx.font='900 30px Arial';ctx.shadowBlur=12;ctx.shadowColor='rgba(70,230,255,.55)';ctx.fillText(Math.floor(Math.max(0,player.x-160)/110)+' m',W-115,96);ctx.shadowBlur=0}
  ctx.restore();
}
function loop(now){const dt=Math.min(.035,((now-state.last)||16.7)/1000);state.last=now;if(state.running)update(dt);render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
